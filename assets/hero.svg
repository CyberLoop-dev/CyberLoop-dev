<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Artan - CyberLoop</title><desc id="desc">Animated neon cyber-inspired banner with orbiting rings and glowing code motifs.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#101b38"/><stop offset="1" stop-color="#07111f"/></linearGradient><linearGradient id="line" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient><filter id="blur"><feGaussianBlur stdDeviation="16"/></filter></defs>
<rect width="1200" height="310" rx="24" fill="url(#bg)"/><ellipse cx="930" cy="145" rx="250" ry="190" fill="url(#glow)" filter="url(#blur)"/>
<g fill="none" stroke="url(#line)" opacity=".65"><path d="M0 250 Q300 190 600 250 T1200 210" stroke-width="1.5"/><path d="M0 270 Q300 210 600 270 T1200 230" stroke-width="1" opacity=".5"/><ellipse cx="950" cy="150" rx="190" ry="66" stroke-width="2" transform="rotate(-18 950 150)"/><ellipse cx="950" cy="150" rx="190" ry="66" stroke-width="1.5" transform="rotate(48 950 150)"/></g>
<g fill="#22d3ee"><circle cx="780" cy="62" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle><circle cx="1090" cy="228" r="4"><animate attributeName="r" values="2;5;2" dur="3.4s" repeatCount="indefinite"/></circle><circle cx="670" cy="210" r="2.5"><animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/></circle></g>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><text x="72" y="76" fill="#22d3ee" font-size="16" letter-spacing="5">OPEN SOURCE / CREATIVE ENGINEERING</text><text x="68" y="164" fill="#f0f6fc" font-size="66" font-weight="800">ARTAN</text><text x="72" y="215" fill="#22d3ee" font-size="37" font-weight="700">aka CyberLoop</text><text x="74" y="260" fill="#a9b9d0" font-size="18" letter-spacing="2">CODE / CREATE / AUTOMATE</text><text x="1030" y="158" text-anchor="middle" fill="#dbeafe" font-size="35">&lt;/&gt;</text></g>
