<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' width='1200' height='420' viewBox='0 0 1200 420' role='img' aria-label='CyberLoop-dev animated banner'>
  <title>CyberLoop-dev</title>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b14'/><stop offset='1' stop-color='#0f1c33'/></linearGradient>
    <linearGradient id='loop' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#22d3ee'/><stop offset='1' stop-color='#34d399'/></linearGradient>
    <pattern id='dots' width='28' height='28' patternUnits='userSpaceOnUse'><circle cx='2' cy='2' r='1.2' fill='#22d3ee' opacity='.16'/></pattern>
    <filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='4' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
    <path id='orbit' d='M140 210a110 110 0 1 0 220 0a110 110 0 1 0 -220 0'/>
    <clipPath id='c1'><rect x='468' y='266' height='40' width='0'><animate attributeName='width' values='0;660;660;0;0' keyTimes='0;0.18;0.31;0.32;1' dur='12s' begin='0s' repeatCount='indefinite'/></rect></clipPath>
    <clipPath id='c2'><rect x='468' y='266' height='40' width='0'><animate attributeName='width' values='0;660;660;0;0' keyTimes='0;0.18;0.31;0.32;1' dur='12s' begin='4s' repeatCount='indefinite'/></rect></clipPath>
    <clipPath id='c3'><rect x='468' y='266' height='40' width='0'><animate attributeName='width' values='0;660;660;0;0' keyTimes='0;0.18;0.31;0.32;1' dur='12s' begin='8s' repeatCount='indefinite'/></rect></clipPath>
  </defs>
  <style>
    text { font-family: JetBrains Mono, Fira Code, Consolas, SFMono-Regular, Courier New, monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none; } }
  </style>

  <rect width='1200' height='420' rx='24' fill='url(#bg)'/>
  <rect width='1200' height='420' rx='24' fill='url(#dots)'/>

  <!-- loop emblem -->
  <circle cx='250' cy='210' r='110' fill='none' stroke='#1e293b' stroke-width='2'/>
  <circle cx='250' cy='210' r='110' fill='none' stroke='url(#loop)' stroke-width='6' stroke-linecap='round' stroke-dasharray='260 432'>
    <animateTransform attributeName='transform' type='rotate' from='0 250 210' to='360 250 210' dur='10s' repeatCount='indefinite'/>
  </circle>
  <circle cx='250' cy='210' r='82' fill='none' stroke='#22d3ee' stroke-opacity='.35' stroke-width='2' stroke-dasharray='4 10'>
    <animateTransform attributeName='transform' type='rotate' from='360 250 210' to='0 250 210' dur='16s' repeatCount='indefinite'/>
  </circle>
  <path d='M250 210c-22-34-64-34-64 0s42 34 64 0 64-34 64 0-42 34-64 0z' fill='none' stroke='url(#loop)' stroke-width='9' stroke-linecap='round' stroke-dasharray='46 16' filter='url(#glow)'>
    <animate attributeName='stroke-dashoffset' from='0' to='-62' dur='1.6s' repeatCount='indefinite'/>
  </path>
  <circle r='8' fill='#fbbf24' filter='url(#glow)'><animateMotion dur='6s' repeatCount='indefinite'><mpath xlink:href='#orbit'/></animateMotion></circle>

  <!-- identity -->
  <text x='470' y='140' font-size='22' fill='#64748b'>Hi, I'm</text>
  <text x='466' y='222' font-size='70' font-weight='700' fill='url(#loop)'>CyberLoop-dev</text>

  <!-- typing lines -->
  <text x='470' y='294' font-size='24' fill='#e2e8f0' clip-path='url(#c1)'>&gt; Building developer tools &amp; automation</text>
  <text x='470' y='294' font-size='24' fill='#e2e8f0' clip-path='url(#c2)'>&gt; AI agents · Robotics · Linux · Embedded</text>
  <text x='470' y='294' font-size='24' fill='#e2e8f0' clip-path='url(#c3)'>&gt; Code that moves things.</text>
  <g><animate attributeName='opacity' values='1;1;0;0' keyTimes='0;0.31;0.32;1' dur='12s' begin='0s' repeatCount='indefinite'/><rect y='272' width='12' height='26' fill='#fbbf24'><animate attributeName='x' values='470;1130;1130;470;470' keyTimes='0;0.18;0.31;0.32;1' dur='12s' begin='0s' repeatCount='indefinite'/></rect></g>
  <g><animate attributeName='opacity' values='0;0;1;1;0;0' keyTimes='0;0.32;0.33;0.64;0.65;1' dur='12s' begin='0s' repeatCount='indefinite'/><rect y='272' width='12' height='26' fill='#fbbf24'><animate attributeName='x' values='470;470;470;1130;1130;470' keyTimes='0;0.33;0.34;0.52;0.64;1' dur='12s' begin='0s' repeatCount='indefinite'/></rect></g>
  <g><animate attributeName='opacity' values='0;0;1;1' keyTimes='0;0.65;0.66;1' dur='12s' begin='0s' repeatCount='indefinite'/><rect y='272' width='12' height='26' fill='#fbbf24'><animate attributeName='x' values='470;470;470;1130;1130' keyTimes='0;0.66;0.67;0.85;1' dur='12s' begin='0s' repeatCount='indefinite'/></rect></g>

  <!-- interest pills -->
  <g font-size='16' fill='#94a3b8' text-anchor='middle'>
    <rect x='470' y='332' width='110' height='34' rx='17' fill='none' stroke='#22d3ee' stroke-opacity='.5'/><text x='525' y='354'>AI Agents</text>
    <rect x='590' y='332' width='101' height='34' rx='17' fill='none' stroke='#34d399' stroke-opacity='.5'/><text x='640' y='354'>Robotics</text>
    <rect x='701' y='332' width='72' height='34' rx='17' fill='none' stroke='#22d3ee' stroke-opacity='.5'/><text x='737' y='354'>Linux</text>
    <rect x='783' y='332' width='101' height='34' rx='17' fill='none' stroke='#34d399' stroke-opacity='.5'/><text x='833' y='354'>Embedded</text>
    <rect x='894' y='332' width='120' height='34' rx='17' fill='none' stroke='#22d3ee' stroke-opacity='.5'/><text x='954' y='354'>Automation</text>
  </g>
</svg>
