<svg xmlns='http://www.w3.org/2000/svg' width='900' height='400' viewBox='0 0 900 400' role='img' aria-label='Animated terminal showing whoami, interests and projects'>
  <title>CyberLoop-dev terminal</title>
  <style>
    text { font-family: JetBrains Mono, Fira Code, Consolas, SFMono-Regular, Courier New, monospace; font-size: 18px; }
    .p { fill: #34d399; } .c { fill: #e2e8f0; } .o { fill: #22d3ee; } .d { fill: #94a3b8; }
    @media (prefers-reduced-motion: reduce) { * { animation: none; } }
  </style>
  <rect x='1' y='1' width='898' height='398' rx='18' fill='#070b14' stroke='#1e293b' stroke-width='2'/>
  <path d='M1 19a18 18 0 0 1 18-18h862a18 18 0 0 1 18 18v36H1z' fill='#0f1c33'/>
  <circle cx='28' cy='28' r='6' fill='#fb7185'/><circle cx='50' cy='28' r='6' fill='#fbbf24'/><circle cx='72' cy='28' r='6' fill='#34d399'/>
  <text x='450' y='34' text-anchor='middle' class='d' style='font-size:15px'>cyberloop@dev: ~</text>

  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.025;0.045;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='96'><tspan class='p'>$ </tspan><tspan class='c'>whoami</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.075;0.095;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='128' class='o'>cyberloop-dev · builder · Iran</text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.15;0.17;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='176'><tspan class='p'>$ </tspan><tspan class='c'>cat interests.txt</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.2;0.22;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='208' class='o'>ai-agents  robotics  linux  embedded  automation  apis</text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.288;0.308;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='256'><tspan class='p'>$ </tspan><tspan class='c'>ls ~/projects</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.338;0.358;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='288' class='o'>tidyup  face-autolock  sysdeck  jsonlens  qrstudio  passcheck</text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.425;0.445;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='336'><tspan class='p'>$ </tspan><tspan class='c'>echo $MOTTO</tspan></text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.475;0.495;0.95;1' dur='16s' repeatCount='indefinite'/><text x='36' y='368' class='o'>code that moves things</text></g>
  <g opacity='0'><animate attributeName='opacity' values='0;0;1;1;0' keyTimes='0;0.5625;0.5625;0.95;1' dur='16s' repeatCount='indefinite'/><rect x='402' y='352' width='11' height='20' fill='#fbbf24'><animate attributeName='opacity' values='1;0;1' dur='1s' repeatCount='indefinite'/></rect></g>
</svg>
